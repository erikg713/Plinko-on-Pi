<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    role="img"
    aria-labelledby="title desc"
>
    <title id="title">Plinko on Pi</title>
    <desc id="desc">
        Plinko game board with a Pi-inspired center symbol
    </desc>

    <defs>
        <linearGradient
            id="background"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#8b5cf6"
            />

            <stop
                offset="100%"
                stop-color="#5b21b6"
            />
        </linearGradient>

        <linearGradient
            id="board"
            x1="0"
            y1="0"
            x2="0"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#1e293b"
            />

            <stop
                offset="100%"
                stop-color="#0f172a"
            />
        </linearGradient>

        <filter
            id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%"
        >
            <feDropShadow
                dx="0"
                dy="8"
                stdDeviation="10"
                flood-opacity="0.3"
            />
        </filter>
    </defs>

    <!-- Background -->
    <rect
        width="512"
        height="512"
        rx="112"
        fill="url(#background)"
    />

    <!-- Inner board -->
    <rect
        x="72"
        y="58"
        width="368"
        height="396"
        rx="72"
        fill="url(#board)"
        stroke="#c4b5fd"
        stroke-width="6"
        filter="url(#shadow)"
    />

    <!-- Plinko rails -->
    <path
        d="M130 112
           L382 112

           M108 166
           L404 166

           M102 220
           L410 220

           M112 274
           L400 274

           M132 328
           L380 328"
        fill="none"
        stroke="#475569"
        stroke-width="8"
        stroke-linecap="round"
    />

    <!-- Peg row 1 -->
    <g
        fill="#f8fafc"
        stroke="#8b5cf6"
        stroke-width="4"
    >
        <circle cx="156" cy="112" r="10"/>
        <circle cx="220" cy="112" r="10"/>
        <circle cx="284" cy="112" r="10"/>
        <circle cx="348" cy="112" r="10"/>
    </g>

    <!-- Peg row 2 -->
    <g
        fill="#f8fafc"
        stroke="#8b5cf6"
        stroke-width="4"
    >
        <circle cx="124" cy="166" r="10"/>
        <circle cx="188" cy="166" r="10"/>
        <circle cx="252" cy="166" r="10"/>
        <circle cx="316" cy="166" r="10"/>
        <circle cx="380" cy="166" r="10"/>
    </g>

    <!-- Peg row 3 -->
    <g
        fill="#f8fafc"
        stroke="#8b5cf6"
        stroke-width="4"
    >
        <circle cx="156" cy="220" r="10"/>
        <circle cx="220" cy="220" r="10"/>
        <circle cx="284" cy="220" r="10"/>
        <circle cx="348" cy="220" r="10"/>
    </g>

    <!-- Peg row 4 -->
    <g
        fill="#f8fafc"
        stroke="#8b5cf6"
        stroke-width="4"
    >
        <circle cx="124" cy="274" r="10"/>
        <circle cx="188" cy="274" r="10"/>
        <circle cx="252" cy="274" r="10"/>
        <circle cx="316" cy="274" r="10"/>
        <circle cx="380" cy="274" r="10"/>
    </g>

    <!-- Peg row 5 -->
    <g
        fill="#f8fafc"
        stroke="#8b5cf6"
        stroke-width="4"
    >
        <circle cx="156" cy="328" r="10"/>
        <circle cx="220" cy="328" r="10"/>
        <circle cx="284" cy="328" r="10"/>
        <circle cx="348" cy="328" r="10"/>
    </g>

    <!-- Center Pi-inspired mark -->
    <circle
        cx="256"
        cy="390"
        r="45"
        fill="#8b5cf6"
        stroke="#ede9fe"
        stroke-width="6"
    />

    <!-- Pi symbol -->
    <path
        d="M225 374
           H287

           M235 374
           V407

           M277 374
           V407"
        fill="none"
        stroke="#ffffff"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Falling ball -->
    <circle
        cx="256"
        cy="78"
        r="13"
        fill="#ffffff"
        stroke="#8b5cf6"
        stroke-width="5"
    />

    <!-- Ball trajectory -->
    <path
        d="M256 91
           C256 102 247 105 247 116"
        fill="none"
        stroke="#c4b5fd"
        stroke-width="4"
        stroke-linecap="round"
        stroke-dasharray="7 8"
    />
</svg>
